	<script>
	
	// =========================
	// START SCRIPTE
	// =========================
	
		const UI = {

			setStats(formData) {
				DOM.hp.textContent = formData.stats.kp;
				DOM.atk.textContent = formData.stats.angriff;
				DOM.def.textContent = formData.stats.verteidigung;
				DOM.spatk.textContent = formData.stats.spezialAngriff;
				DOM.spdef.textContent = formData.stats.spezialVerteidigung;
				DOM.init.textContent = formData.stats.initiative;
			},

			setTypes(formData) {
				DOM.typ1.textContent = formData.typen[0] || "";
				DOM.typ2.textContent = formData.typen[1] || "";
			},

			setEggGroups(formData) {

				DOM.ei1.textContent = formData.eiergruppen[0] || "";
				DOM.ei2.textContent = formData.eiergruppen[1] || "";

				DOM.ei1.style.display =
					formData.eiergruppen[0] ? "flex" : "none";

				DOM.ei2.style.display =
					formData.eiergruppen[1] ? "flex" : "none";

			},

			setSprite(pokemon, formName) {
				setSpriteWithFallback(pokemon, formName);
			},

			setAbilities(formData) {

				const key = getAbilitiesKey(formData);

				if (uiCache.abilitiesKey === key) return;
				uiCache.abilitiesKey = key;


				const abilitySelect = DOM.ability;

				const dropdown =
					document.getElementById("abilityDropdown");

				const selected =
					document.getElementById("abilitySelected");

				const selectedName =
					document.getElementById("abilitySelectedName");

				const optionsContainer =
					document.getElementById("abilityOptions");


				if (
					!abilitySelect ||
					!dropdown ||
					!selected ||
					!selectedName ||
					!optionsContainer
				) {
					return;
				}


				// =========================
				// Fähigkeiten ermitteln
				// =========================

				abilitySelect.innerHTML = "";
				optionsContainer.innerHTML = "";

				if (!formData) {

					selectedName.textContent =
						"Fähigkeit auswählen";

					return;
				}


				let abilities = [];


				if (Array.isArray(formData.faehigkeiten)) {

					abilities = formData.faehigkeiten;

				} else {

					if (formData.faehigkeiten?.normal) {
						abilities.push(
							...formData.faehigkeiten.normal
						);
					}

					if (formData.faehigkeiten?.hidden) {
						abilities.push(
							formData.faehigkeiten.hidden
						);
					}

					if (formData.faehigkeiten?.versteckt) {
						abilities.push(
							formData.faehigkeiten.versteckt
						);
					}

				}


				// Doppelte Einträge entfernen
				abilities = [
					...new Set(
						abilities.filter(Boolean)
					)
				];


				// =========================
				// Verstecktes Select
				// =========================

				abilities.forEach(ability => {

					const option =
						document.createElement("option");

					option.value = ability;
					option.textContent = ability;

					abilitySelect.appendChild(option);

				});


				// =========================
				// Sichtbares Dropdown
				// =========================

				abilities.forEach(ability => {

					const option =
						document.createElement("button");

					option.type = "button";

					option.className =
						"ability-option";

					option.dataset.value =
						ability;


					const description =
						abilityDescriptions[ability] || "";


					option.innerHTML = `

						<div class="ability-option-name">
							${ability}
						</div>

						${
							description
								? `
									<div class="ability-option-description">
										${description}
									</div>
								`
								: ""
						}

					`;

					optionsContainer.appendChild(option);

				});
				
				optionsContainer.onclick = event => {

					const option =
						event.target.closest(".ability-option");

					if (!option) return;

					event.stopPropagation();

					const ability =
						option.dataset.value;

					abilitySelect.value = ability;

					selectedName.textContent =
						ability;

					updateAbilityDropdown();

					dropdown.classList.remove("open");

					requestPreviewUpdate();

				};


				// Aktuellen Wert anzeigen
				updateAbilityDropdown();


				// =========================
				// Öffnen / Schließen
				// =========================

				selected.onclick = event => {

					event.stopPropagation();

					dropdown.classList.toggle("open");

				};


				// =========================
				// Klick außerhalb
				// =========================

				if (!dropdown.dataset.listenerAttached) {

					document.addEventListener("click", event => {

						if (!dropdown.contains(event.target)) {

							dropdown.classList.remove("open");

						}

					});

					dropdown.dataset.listenerAttached = "true";

				}

			},

			setGender(formData) {
				const key = getGenderKey(formData);

				if (uiCache.genderKey === key) return;
				uiCache.genderKey = key;

				const select = DOM.geschlecht;
				select.innerHTML = "";

				if (!formData) return;

				const g = formData.geschlecht;

				if (Array.isArray(g)) {
					g.forEach(val => {
						const opt = document.createElement("option");
						opt.value = val;
						opt.textContent = val;
						select.appendChild(opt);
					});

				} else if (g === null) {
					const opt = document.createElement("option");
					opt.value = "Geschlechtslos";
					opt.textContent = "Geschlechtslos";
					select.appendChild(opt);

				} else {
					Object.keys(g).forEach(val => {
						const opt = document.createElement("option");
						opt.value = val;
						opt.textContent = val;
						select.appendChild(opt);
					});
				}
			}
		};

		const uiCache = {
			pokemonIndex: null,
			formName: null,
			abilitiesKey: null,
			genderKey: null
		};

		const state = {
			pokemonIndex: 0,
			formName: null
		};

		function setState(newState) {
			Object.assign(state, newState);
		}

	</script>

	<script>
		function render() {

			const pokemon = getCurrentBasePokemon();

			if (!pokemon) return;

			const formName =
				state.formName ||
				Object.keys(pokemon.forms)[0];

			const formData = pokemon.forms[formName];
			if (!formData) return;
			
			setType("typ1", formData.typen?.[0]);
			setType("typ2", formData.typen?.[1]);

			// SPRITE + BASIC UPDATE nur bei Pokémonwechsel
		if (
			uiCache.pokemonIndex !== state.pokemonIndex ||
			uiCache.formName !== formName
		) {

			updateForms(pokemon);

			nummerSelect.value = pokemon.nummer;
			nameSelect.value = pokemon.nummer;

			uiCache.pokemonIndex = state.pokemonIndex;
		}

			// FORM synchronisieren
			if (uiCache.formName !== formName) {
				DOM.form.value = formName;
				uiCache.formName = formName;
			}

			// =========================
			// FORM-ABHÄNGIGE UI
			// =========================

			UI.setTypes(formData);
			UI.setEggGroups(formData);
			UI.setStats(formData);
			UI.setAbilities(formData);
			UI.setSprite(pokemon, formName);

			renderGenderButtons(formData);

			calculateTotalStats();
			requestPreviewUpdate();
		}



		function getAbilitiesKey(formData) {
			if (!formData) return "";

			if (Array.isArray(formData.faehigkeiten)) {
				return formData.faehigkeiten.join("|");
			}

			return [
				...(formData.faehigkeiten?.normal || []),
				formData.faehigkeiten?.hidden || "",

	<script>

		// ======================================================
		// Pokemon in Spiel vorhanden
		// ======================================================
		
		function isPokemonAvailableInGame(pokemon, game) {

			if (!pokemon || !pokemon.nummer || !game) {
				return false;
			}

			const rule =
				POKEMON_TRANSFER_RULES[pokemon.formId];

			// Keine spezielle Einschränkung
			if (!rule) {
				return true;
			}

			// Keine Ausschlussliste
			if (!Array.isArray(rule.exclude)) {
				return true;
			}

			return !rule.exclude.includes(game);

		}
		
		// ======================================================
		// Pokemon als Nummer transferieren
		// ======================================================
		function getTransferCalculationNumber(pokemon) {

			if (!pokemon || !pokemon.nummer) {
				return null;
			}

			const rule =
				POKEMON_TRANSFER_RULES[pokemon.formId];

			if (!rule || !rule.transferAs) {
				return pokemon.nummer;
			}

			return rule.transferAs;
		}

		// ======================================================
		// Gemeinsame Transferberechnung
		// ======================================================

		function calculatePokemonTransferStages(pokemon) {

			if (!pokemon || !pokemon.game) {
				return [];
			}


			// ==================================================
			// Aktuelle Pokémon-Art
			// ==================================================

			const currentNumber =
				Number(pokemon.nummer);


			// ==================================================
			// Form-ID
			// ==================================================

			const currentFormId =
				pokemon.formId ||
				String(currentNumber);


			// ==================================================
			// Entwicklungsregel
			// ==================================================

			const evolutionRule =
				POKEMON_TRANSFER_EVOLUTION_RULES[currentNumber];


			// ==================================================
			// Fangspiel ermitteln
			// ==================================================

			const originNode =
				TRANSFER_GAME_ALIASES[pokemon.game];


			if (!originNode) {

				console.warn(
					"Kein Transfer-Node für Fangspiel gefunden:",
					pokemon.game
				);

				return [];
			}


			// ==================================================
			// Generation des Ursprungsspiels
			// ==================================================

			const originGameNode =
				TRANSFER_NODES[originNode];


			const originGeneration =
				originGameNode?.generation;


			// ==================================================
			// Transferwege berechnen
			// ==================================================

			const reachableNodes =
				findTransferPaths(originNode);


			// ==================================================
			// Nur Spiele
			// ==================================================

			const games =
				reachableNodes.filter(nodeKey =>
					TRANSFER_NODES[nodeKey]?.type === "game"
				);


			// ==================================================
			// Transferstufen erzeugen
			// ==================================================

			return games
				.map(game => {

					// ----------------------------------------------
					// Standardmäßig aktuelle Pokémon-Art
					// ----------------------------------------------

					let pokemonId =
						currentNumber;


					// ----------------------------------------------
					// Entwicklungsregel
					// ----------------------------------------------

					if (
						evolutionRule &&
						evolutionRule.transferAs &&
						evolutionRule.availableFromGeneration &&
						originGeneration
					) {

						const targetNode =
							TRANSFER_NODES[game];


						const targetGeneration =
							targetNode?.generation;


						if (
							originGeneration <
								evolutionRule.availableFromGeneration &&

							targetGeneration &&
							targetGeneration <
								evolutionRule.availableFromGeneration
						) {

							pokemonId =
								evolutionRule.transferAs;

						}

					}


					// ----------------------------------------------
					// Transferregel bestimmen
					// ----------------------------------------------
					//
					// Wichtig:
					// Die Formregel hat Vorrang.
					// Danach normale Pokémon-ID als Fallback.
					//

					const transferRule =
						POKEMON_TRANSFER_RULES[currentFormId]
						||
						POKEMON_TRANSFER_RULES[String(pokemonId)]
						||
						POKEMON_TRANSFER_RULES[pokemonId];


					// ----------------------------------------------
					// Pokémon in diesem Spiel ausgeschlossen?
					// ----------------------------------------------

					if (
						transferRule &&
						Array.isArray(transferRule.exclude) &&
						transferRule.exclude.includes(game)
					) {

						return null;

					}


					return {
						game: game,
						pokemonId: pokemonId,
						formId: currentFormId
					};

				})
				.filter(stage =>
					stage !== null
				);

		}

		// ======================================================
		// Transfer-Spiele für gespeicherte Pokémon
		//
		// Diese Funktion wird von den Statistiken verwendet.
		// Nur tatsächlich gefangene Pokémon zählen.
		// ======================================================

		function getPokemonTransferGames(pokemon) {

			if (!pokemon) {
				return [];
			}

			if (pokemon.gefangen !== true) {
				return [];
			}

			return calculatePokemonTransferGames(pokemon);

		}


		// ======================================================
		// Transfer-Spiele für den Editor
		//
		// Hier spielt "gefangen" bewusst keine Rolle.
		// Das Pokémon wird gerade bearbeitet.
		// ======================================================

		function getEditorTransferGames() {

			const pokemon =
				getEditorPokemon();

			if (!pokemon.nummer || !pokemon.game) {
				return [];
			}

			return calculatePokemonTransferGames(pokemon);

		}


		// ======================================================
		// Bänder rendern
		// ======================================================

		function renderBaender(savedBands = null) {

			DOM.bandContainer.innerHTML = "";

			const active =
				new Set(savedBands || []);


			// ==================================================
			// Aktuelles Pokémon aus dem Editor
			// ==================================================

			const editorPokemon =
				getEditorPokemon();


			// ==================================================
			// Transferstufen berechnen
			// ==================================================

			const transferStages =
				calculatePokemonTransferStages(
					editorPokemon
				);


			// ==================================================
			// Fangspiel
			// ==================================================

			const originGame =
				TRANSFER_GAME_ALIASES[
					editorPokemon.game
				];


			// ==================================================
			// Pokéball
			// ==================================================

			const ball =
				editorPokemon.ball;


			// ==================================================
			// Bänder prüfen
			// ==================================================

			const availableBands =
				baender.filter(band => {

					const rule =
						BAND_RULES[band.name];


					// --------------------------------------------------
					// Keine spezielle Regel
					// --------------------------------------------------

					if (!rule) {
						return true;
					}


					// ==================================================
					// 1. Spielbedingung
					// ==================================================

					if (Array.isArray(rule.games)) {

						const gameAllowed =
							transferStages.some(stage =>
								rule.games.includes(stage.game)
							);

						if (!gameAllowed) {
							return false;
						}

					}


					// ==================================================
					// 2. Ursprungs-Spielbedingung
					// ==================================================

					if (Array.isArray(rule.originGames)) {

						const originAllowed =
							rule.originGames.includes(
								originGame
							);

						if (!originAllowed) {
							return false;
						}

					}


					// ==================================================
					// 3. Pokéball-Bedingung
					// ==================================================

					if (Array.isArray(rule.balls)) {

						const ballAllowed =
							rule.balls.includes(ball);

						if (!ballAllowed) {
							return false;
						}

					}


					// ==================================================
					// 4. Pokémon-spezifische Bedingung
					// ==================================================

					if (rule.pokemonIds) {

						const pokemonAllowed =
							transferStages.some(stage => {

								if (!rule.pokemonIds.includes(
									stage.pokemonId
								)) {
									return false;
								}

								if (
									Array.isArray(rule.games) &&
									!rule.games.includes(stage.game)
								) {
									return false;
								}

								return true;

							});

						if (!pokemonAllowed) {
							return false;
						}

					}
					
					// ==================================================
					// 5. Konflikt mit bereits ausgewählten Bändern
					// ==================================================

					const hasConflict =
						baender.some(otherBand => {

							if (!active.has(otherBand.name)) {
								return false;
							}

							const otherRule =
								BAND_RULES[otherBand.name];

							if (!otherRule) {
								return false;
							}

							const directConflict =
								Array.isArray(rule.conflictsWith) &&
								rule.conflictsWith.includes(otherBand.name);

							const reverseConflict =
								Array.isArray(otherRule.conflictsWith) &&
								otherRule.conflictsWith.includes(band.name);

							return directConflict || reverseConflict;

						});

					if (hasConflict) {
						return false;
					}

					// ==================================================
					// Alle Bedingungen erfüllt
					// ==================================================

					return true;

				});


			// ==================================================
			// Bänder darstellen
			// ==================================================

			availableBands.forEach(band => {

				const row =
					document.createElement("div");

				row.className =
					"band-item";


				// --------------------------------------------------
				// Checkbox
				// --------------------------------------------------

				const checkbox =
					document.createElement("input");

				checkbox.type =
					"checkbox";

				checkbox.dataset.band =
					band.name;

				checkbox.checked =
					active.has(band.name);

				checkbox.addEventListener(
					"change",
					() => {

						const selectedBands =
							Array.from(
								DOM.bandContainer.querySelectorAll(
									'input[type="checkbox"]:checked'
								)
							).map(cb =>
								cb.dataset.band
							);


						renderBaender(selectedBands);

						requestPreviewUpdate();

					}
				);


				// --------------------------------------------------
				// Bild
				// --------------------------------------------------

				const img =
					document.createElement("img");

				img.className =
					"band-img";

				img.src =
					`https://raw.githubusercontent.com/kwsch/PKHeX/master/PKHeX.Drawing.Misc/Resources/img/ribbons/${band.image}.png`;

				img.alt =
					band.name;


				// --------------------------------------------------
				// Textcontainer
				// --------------------------------------------------

				const text =
					document.createElement("div");

				text.className =
					"band-text";


				// --------------------------------------------------
				// Name
				// --------------------------------------------------

				const name =
					document.createElement("div");

				name.className =
					"band-name";

				name.textContent =
					band.name;


				// --------------------------------------------------
				// Titel
				// --------------------------------------------------

				const title =
					document.createElement("div");

				title.className =
					"band-title";

				title.textContent =
					band.title
						? `(${band.title})`
						: "";


				// --------------------------------------------------
				// Zusammensetzen
				// --------------------------------------------------

				text.appendChild(name);
				text.appendChild(title);

				row.appendChild(checkbox);
				row.appendChild(img);
				row.appendChild(text);

				DOM.bandContainer.appendChild(row);

			});

			updateBandCounter();

			// ==================================================
			// Debug
			// ==================================================

			console.log(
				"Editor Pokémon:",
				editorPokemon
			);

			console.log(
				"Editor Transferstufen:",
				transferStages
			);

		}

		// ======================================================
		// Editor aktualisieren
		// ======================================================

		function updateEditorBaender() {

			renderBaender();
			requestPreviewUpdate();

		}

		// ======================================================
		// Fangspiel geändert
		// ======================================================

		DOM.game.addEventListener(
			"change",
			() => {

				updateEditorBaender();

			}
		);

		// ======================================================
		// Initialisierung
		// ======================================================

		renderBaender();

	</script>

		return {

			id: editingPokemon?.id ?? crypto.randomUUID(),

			level: Number(DOM.level.value),

			wesen: DOM.wesen.value,

			faehigkeit: DOM.ability.value,

			ball: DOM.pokeball.value,

			stats: {

				hp: Number(DOM.totalHp.textContent),
				atk: Number(DOM.totalAtk.textContent),
				def: Number(DOM.totalDef.textContent),
				spatk: Number(DOM.totalSpatk.textContent),

			},

			attacken: getSelectedAttacks(),

			bands: Array.from(
				document.querySelectorAll("#bandContainer input[type='checkbox']")
			).map(cb => ({
				name: cb.dataset.band,
				active: cb.checked
			})),

			favorit: editingPokemon?.favorit ?? false

		};

	}

	function getCurrentPokemon() {
		return createPokemonData();
	}
	
	let previewUpdatePending = false;

	function updatePreview() {

		const preview = DOM.preview;

		preview.replaceChildren(
			createDetailCard(getCurrentPokemon(), false)
		);

	}

	function requestPreviewUpdate() {

		if (previewUpdatePending) return;

		previewUpdatePending = true;

		requestAnimationFrame(() => {

			previewUpdatePending = false;

			updatePreview();

		});

	}
	
	function initPreview() {

		document.addEventListener(
			"input",
			handlePreviewInput
		);

		document.addEventListener(
			"change",
			handlePreviewInput
		);

	}

	function handlePreviewInput(event) {

		if (
			event.target.matches(
				"input, select, textarea"
			)
		) {
			requestPreviewUpdate();
		}

	}
	
	</script>

		function getNextColor(current) {

				editorData.colors.indexOf(current);

			return editorData.colors[
				(index + 1) % editorData.colors.length
			];
		}

		function renderMarkierungen(savedMarks = null) {

			DOM.markContainer.innerHTML = "";

			editorData.symbols.forEach(symbol => {

				const el =
					document.createElement("div");

				el.className = "mark-icon";
				el.textContent = symbol;

				el.dataset.symbol = symbol;

				const savedMap = new Map(
					(savedMarks || []).map(
						mark => [mark.symbol, mark]
					)
				);
				
				const saved = savedMap.get(symbol);

				el.dataset.color =
					saved?.color || editorData.colors[0];

				el.style.color =
					el.dataset.color;

				el.addEventListener("click", () => {

					const nextColor =
						getNextColor(el.dataset.color);

					el.dataset.color =
						nextColor;

					el.style.color =
						nextColor;
				});

				DOM.markContainer.appendChild(el);

			});
		}

				shiny

		// Pokemon laden
		function loadEditMode(editData) {

			editingPokemon = JSON.parse(editData);

			nameSelect.classList.add("locked-select");


			const pokemon = pokemonListe.find(

			if (!pokemon) return;

			updatePokemon(
				editingPokemon.nummer,
				editingPokemon.form
			);


			// Warten bis alle Dropdowns / DOM-Elemente erstellt wurden
			requestAnimationFrame(() => {

				// Alle normalen Felder laden
				applyEditModeData(editingPokemon);

				// Bänder laden
				renderBaender(
					editingPokemon.bands
						?.filter(b => b.active)
						.map(b => b.name)
				);

				// Markierungen laden
				renderMarkierungen(
					editingPokemon.marks
				);

				// Attacken nach dem Erstellen der Dropdowns laden
				if (editingPokemon.attacks) {

					setSelectedAttacks(
						editingPokemon.attacks
					);

				}

				calculateTotalStats();

				requestPreviewUpdate();

			});

			DOM.smart.value = p.klugheit ?? 0;
			DOM.cute.value = p.putzigkeit ?? 0;
			DOM.tough.value = p.staerke ?? 0;

		function applyEditModeData(pokemon) {

			// --- sichere Select Setter ---
			function setSelectValue(el, value) {
				if (!el) return;
				const exists = [...el.options].some(o => o.value === value);
				if (exists) el.value = value;
			}

			DOM.height.value = pokemon.groesse || "M";
			DOM.wesen.value = pokemon.wesen || "";
			DOM.pokestar.value = pokemon.pokestar || "";
			DOM.shinycrown.value = pokemon.blaetterkrone || "";
			
			restoreOriginData(pokemon);

			DOM.trainerID.value = pokemon.trainerID || "";
			DOM.trainer.value = pokemon.ogTrainer || "";

			DOM.notes.value = pokemon.notizen || "";

			document.getElementById("teratype").value =

			document.getElementById("dynamax").value =
				pokemon.dynamax || "Nein";

			setSelectValue(

			);

			updateAbilityDropdown();

			document.getElementById("personality").value =
				pokemon.persoenlichkeit || "";

			// ===== Status =====

			currentGender = pokemon.geschlecht || "Männlich";
			isShiny = pokemon.shiny === true;
			isCaught = pokemon.gefangen === true;

			shinyBtn.classList.toggle("active", isShiny);

			renderGenderButtons(getCurrentFormData());
			updateCurrentPokemonSprite();

			updateCaughtButton();
			caughtBtn.classList.toggle("active", isCaught);

			// ===== Ball =====

			setSelectValue(DOM.pokeball, pokemon.ball);
			updatePokeballDropdown();

			// ===== Contest =====

			setContestValues(pokemon);
			
			// ===== Level =====

			DOM.level.value = pokemon.level || 100;
			DOM.catchlevel.value = pokemon.catchlevel || 100;

			// ===== IVs =====

			if (pokemon.ivs) {

				document.querySelectorAll(".iv-input").forEach((input, i) => {
					input.value = pokemon.ivs[i] ?? 0;
				});

			}

			// ===== EVs =====

			if (pokemon.evs) {

				document.querySelectorAll(".ev-input").forEach((input, i) => {
					input.value = pokemon.evs[i] ?? 0;
				});

			}

			// ===== Attacken =====

			if (pokemon.attacken) {

				setSelectedAttacks(
					pokemon.attacken
				);

			}

			// ===== Bänder =====

			const bandInputs = document.querySelectorAll(
				"#bandContainer input[type='checkbox']"
			);

			if (pokemon.bands && bandInputs.length) {

				bandInputs.forEach(cb => {

					const found = pokemon.bands.find(
						b => b.name === cb.dataset.band
					);

					cb.checked = found ? found.active : false;

				});

			}

			// ===== Marks =====

			const markEls = document.querySelectorAll(".mark-icon");

			if (pokemon.marks && markEls.length) {

				markEls.forEach(el => {

					const found = pokemon.marks.find(
						m => m.symbol === el.dataset.symbol
					);

					if (found) {

						el.dataset.color = found.color;
						el.style.color = found.color;

					}

				});

			}

			// ===== Sprite =====

			const basePokemon = getCurrentBasePokemon();

			if (basePokemon) {

				setSpriteWithFallback(
					basePokemon,
					pokemon.form || "Standard"
				);

			}

		}

	<script>
		function calculateTotalStats() {

			const base = [
				Number(DOM.hp.textContent) || 0,
				Number(DOM.atk.textContent) || 0,
				Number(DOM.def.textContent) || 0,
				Number(DOM.spatk.textContent) || 0,
				Number(DOM.spdef.textContent) || 0,
				Number(DOM.init.textContent) || 0
			];

			const ivs = Array.from(document.querySelectorAll(".iv-input"))
				.map(i => Number(i.value) || 0);

			const evs = Array.from(document.querySelectorAll(".ev-input"))
				.map(i => Number(i.value) || 0);

			// WICHTIG: immer aktuellen DOM Wert nehmen
			const level = Number(DOM.level?.value ?? 100) || 100;

			const nature = DOM.wesen?.value || "";

			const stats = [
				calcStat(base[0], ivs[0], evs[0], level, true),
				calcStat(base[1], ivs[1], evs[1], level) * getNatureModifier("atk", nature),
				calcStat(base[2], ivs[2], evs[2], level) * getNatureModifier("def", nature),
				calcStat(base[3], ivs[3], evs[3], level) * getNatureModifier("spatk", nature),
				calcStat(base[4], ivs[4], evs[4], level) * getNatureModifier("spdef", nature),
				calcStat(base[5], ivs[5], evs[5], level) * getNatureModifier("init", nature)
			];

			const pokemonNummer = Number(
				DOM.nummerSelect?.value ?? DOM.nummerSelect?.textContent
			);

			const finalStats = [

				pokemonNummer === 292
					? 1
					: Math.floor(stats[0]),

				Math.floor(stats[1]),

				Math.floor(stats[2]),

				Math.floor(stats[3]),

				Math.floor(stats[4]),

				Math.floor(stats[5])

			];


			// Höchsten der sechs Statuswerte bestimmen

			const maxStat = Math.max(...finalStats);


			// Werte + Balken aktualisieren

			const totalElements = [

				DOM.totalHp,
				DOM.totalAtk,
				DOM.totalDef,
				DOM.totalSpatk,
				DOM.totalSpdef,
				DOM.totalInit

			];


			totalElements.forEach((element, index) => {

				const value = finalStats[index];

				const valueElement =
					element.querySelector(".total-value");

				const bar =
					element.querySelector(".stat-bar-fill");


				// Zahl anzeigen

				valueElement.textContent = value;


				// Verhältnis zum höchsten Statuswert

				const percentage =
					maxStat > 0
						? (value / maxStat) * 100
						: 0;


				bar.style.width =
					`${percentage}%`;

			});
		}

		document.querySelectorAll(".iv-input, .ev-input").forEach(i =>
			i.addEventListener("input", () => {
				calculateTotalStats();
				requestPreviewUpdate();
			})
		);

		DOM.level.addEventListener("input", calculateTotalStats);
		DOM.wesen.addEventListener("change", calculateTotalStats);

		function getNatureModifier(statName, nature) {

			if (!nature) return 1;

			const modifier = editorData.natureModifiers[nature];

			if (!modifier) return 1;

			if (modifier.up === statName) return 1.1;
			if (modifier.down === statName) return 0.9;

			return 1;
		}
		
		function calcStat(base, iv, ev, level, isHP = false) {

			if (isHP) {
				return Math.floor(
					((2 * base + iv + Math.floor(ev / 4)) * level) / 100
				) + level + 10;
			}

			return Math.floor(
				(Math.floor(((2 * base + iv + Math.floor(ev / 4)) * level) / 100) + 5)
			);
		}

	</script>

	<script>
		function renderGenderButtons(formData) {

			const container = DOM.genderContainer;

			container.innerHTML = "";

			if (!formData?.geschlecht) return;

			const rawGenders =
				Array.isArray(formData.geschlecht)
				? formData.geschlecht
				: Object.keys(formData.geschlecht);

			const genders =
				rawGenders.filter(g =>
					g === "Männlich" ||
					g === "Weiblich"
				);

			// Keine echten Geschlechter vorhanden
			if (genders.length === 0) {

				currentGender = "Unbekannt";

				return;
			}

			// =========================
			// Nur ein Geschlecht
			// =========================

			if (genders.length === 1) {

				currentGender = genders[0];

				const btn = document.createElement("button");

				btn.className = "toggle-btn active";

				const female = currentGender === "Weiblich";

				btn.textContent = female ? "♀" : "♂";

				btn.classList.add(
					female ? "female" : "male"
				);

				container.appendChild(btn);

				return;
			}

			// =========================
			// Beide Geschlechter
			// =========================

			if (!genders.includes(currentGender)) {
				currentGender = genders[0];
			}

			const btn = document.createElement("button");

			btn.className = "toggle-btn active";

			function updateButton() {

				const female = currentGender === "Weiblich";

				btn.textContent = female ? "♀" : "♂";

				btn.classList.toggle("female", female);
				btn.classList.toggle("male", !female);
			}

			updateButton();

			btn.addEventListener("click", () => {

				currentGender =
					currentGender === "Männlich"
					? "Weiblich"
					: "Männlich";

				updateButton();

				updateCurrentPokemonSprite();
				requestPreviewUpdate();
			});

			container.appendChild(btn);
		}

		const shinyBtn = DOM.shinyBtn

		shinyBtn.addEventListener("click", () => {

			isShiny = !isShiny;

			shinyBtn.classList.toggle(
				"active",
				isShiny
			);

			updateCurrentPokemonSprite();
			requestPreviewUpdate();
		});

		const caughtBtn = DOM.caughtBtn;

		caughtBtn.addEventListener("click", () => {

			isCaught = !isCaught;

			updateCaughtButton();
		});

		function updateCaughtButton() {

			caughtBtn.classList.toggle(
				"active",
				isCaught
			);

			caughtBtn.title =
				isCaught
				? "Gefangen"
				: "Nicht gefangen";
		}

	</script>

						</div>

						<div class="attack-type-label">
							${atk.type}
						</div>

					</div>

				</div>

					</div>
				`;


				wrapper.dataset.value = atk.name;

			}

			ATTACKS.forEach(atk => {

				const typeClass = attackTypeMap[atk.type] || "normal";

				const option = document.createElement("div");

				option.className = `attack-option type-${typeClass}`;
				option.dataset.name = atk.name.toLowerCase();

				option.innerHTML = `
					<div class="attack-corner">
						${getTypeIcon(atk.type)}
					</div>

					<div class="attack-power">
						${atk.power || "—"}
					</div>

					<div class="attack-title">
						${atk.name}
					</div>

					<div class="attack-divider"></div>

					<div class="attack-bottom">

						<div class="attack-description-box">
							${atk.description || "&nbsp;"}
						</div>

						<div class="attack-footer">

							<div class="attack-category-label">
								${attackCategoryMap[atk.category] || ""}
								${atk.category}
							</div>

							<div class="attack-type-label">
								${atk.type}
							</div>

						</div>

					</div>
				`;

				option.addEventListener("click", e => {

					e.stopPropagation();

					setSelected(atk);

					wrapper.classList.remove("open");

					requestPreviewUpdate();

				});


				options.appendChild(option);

			});


			search.addEventListener("input", () => {

				const value = search.value.toLowerCase().trim();

				options.querySelectorAll(".attack-option").forEach(option => {

					option.style.display =
						option.dataset.name.includes(value)
							? ""
							: "none";

				});

			});


			selected.addEventListener("click", e => {

				e.stopPropagation();

				wrapper.classList.toggle("open");

				if(wrapper.classList.contains("open")) {

					search.value = "";

					search.dispatchEvent(new Event("input"));

					search.focus();

				}

			});


			options.prepend(search);

			wrapper.appendChild(selected);
			wrapper.appendChild(options);

			container.appendChild(wrapper);



			// gespeicherter Wert
			if(initialValue) {

				const atk = ATTACKS.find(a => a.name === initialValue);

				if(atk) {
					setSelected(atk);
					return;
				}

			}


			// Standardattacke
			if(ATTACKS.length > 0) {
				setSelected(ATTACKS[0]);
			}

		}

		function setSelectedAttacks(attacks) {

			const dropdowns = document.querySelectorAll(".attack-dropdown");

			dropdowns.forEach((dropdown, i) => {

				const name = attacks[i];
				if (!name) return;

				const atk = ATTACKS.find(a => a.name === name);
				if (!atk) return;


				const selected = dropdown.querySelector(".attack-selected");

				const typeClass = attackTypeMap[atk.type] || "normal";


				// Typklasse setzen
				dropdown.classList.forEach(cls => {
					if (cls.startsWith("type-")) {
						dropdown.classList.remove(cls);
					}
				});

				dropdown.classList.add(`type-${typeClass}`);


				selected.className =
					`attack-selected type-${typeClass}`;


				selected.innerHTML = `
					<div class="attack-corner">
						${getTypeIcon(atk.type)}
					</div>

					<div class="attack-power">
						${atk.power || "—"}
					</div>

					<div class="attack-title">
						${atk.name}
					</div>

					<div class="attack-divider"></div>

					<div class="attack-bottom">

						<div class="attack-description-box">
							${atk.description || "&nbsp;"}
						</div>

						<div class="attack-footer">

							<div class="attack-category-label">
								${attackCategoryMap[atk.category] || ""}
								${atk.category}
							</div>

							<div class="attack-type-label">
								${atk.type}
							</div>

						</div>

					</div>
				`;


				dropdown.dataset.value = atk.name;

			});
		}

	</script>
	
	<script>
	// Update Game Data
		
	function populateGameDropdown(generation = null) {

		const currentGame = DOM.game.value;

		DOM.game.innerHTML = "";

		Object.entries(GAME_DATA).forEach(([gameName, gameData]) => {

			const filterGeneration =
				generation === null || generation === ""
				? null
				: Number(generation);
		
			if (
				filterGeneration !== null &&
				gameData.generation !== filterGeneration
			) {
				return;
			}

			const option = document.createElement("option");

			option.value = gameName;
			option.textContent = gameName;

			if (gameName === currentGame) {
				option.selected = true;
			}

			DOM.game.appendChild(option);

		});
		
		if (!DOM.game.value && DOM.game.options.length > 0) {

			DOM.game.selectedIndex = 0;

		}

	}
	
	DOM.generation.addEventListener("change", () => {

		if (DOM.generation.value === "") {

			populateGameDropdown();

		} else {

			populateGameDropdown(
				Number(DOM.generation.value)
			);

		}

		updateGameData();

		updateEditorBaender();

	});
		
	function updateGameData() {

		const game = DOM.game.value;

		const gameData = GAME_DATA[game];

		if (!gameData) {

			updateLocationDropdown([]);
			return;

		}

		updateLocationDropdown(gameData.locations);

	}
	
	function restoreOriginData(pokemon) {

		const generation = pokemon.generation;
		const game = pokemon.game;
		const location = pokemon.location;


		// =========================================
		// Generation setzen
		// =========================================

		DOM.generation.value =
			generation !== undefined &&
			generation !== null
				? String(generation)
				: "";


		// =========================================
		// Passende Spiele erzeugen
		// =========================================

		if (DOM.generation.value === "") {

			populateGameDropdown();

		} else {

			populateGameDropdown(
				Number(DOM.generation.value)
			);

		}


		// =========================================
		// Gespeichertes Spiel auswählen
		// =========================================

		if (
			game &&
			[...DOM.game.options]
				.some(option => option.value === game)
		) {

			DOM.game.value = game;

		}


		// =========================================
		// Orte des Spiels erzeugen
		// =========================================

		updateGameData();


		// =========================================
		// Gespeicherten Ort auswählen
		// =========================================

		if (
			location &&
			[...DOM.location.options]
				.some(option => option.value === location)
		) {

			DOM.location.value = location;

		}

	}
		
	function updateLocationDropdown(locations) {

		DOM.location.innerHTML = "";

		locations.forEach(location => {

			const option = document.createElement("option");

			option.value = location.name ?? location;
			option.textContent = location.name ?? location;

			DOM.location.appendChild(option);

		});

	}
	
	DOM.game.addEventListener("change", () => {

		updateGameData();

	});

	</script>
	
	
	<script>
	// Hide attack and stats
	document.querySelectorAll(".group-toggle").forEach(header => {

		header.addEventListener("click", () => {

			const group = header.parentElement;

			group.classList.toggle("collapsed");

			const arrow = header.querySelector(".toggle-arrow");

			arrow.textContent =
				group.classList.contains("collapsed")
					? "▼"
					: "▲";

		});

	});

	</script>
	
	<script>
	
		/* =========================
		   Pokéball Auswahl
		========================= */

		const POKEBALL_SPRITE_BASE =
			"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/";
		
		function initPokeballDropdown() {

			const dropdown =
				document.getElementById("pokeballDropdown");

			const selected =
				document.getElementById("pokeballSelected");

			const selectedImage =
				document.getElementById("pokeballSelectedImage");

			const selectedName =
				document.getElementById("pokeballSelectedName");

			const optionsContainer =
				document.getElementById("pokeballOptions");

			const select =
				document.getElementById("pokeball");


			if (
				!dropdown ||
				!selected ||
				!selectedImage ||
				!selectedName ||
				!optionsContainer ||
				!select
			) {
				return;
			}


			// =========================================
			// Verstecktes Select aus editorData erzeugen
			// =========================================

			select.innerHTML = "";

			editorData.pokeballs.forEach(ball => {

				const option =
					document.createElement("option");

				option.value = ball.value;
				option.textContent = ball.name;

				select.appendChild(option);

			});


			// =========================================
			// Sichtbares Dropdown erzeugen
			// =========================================

			optionsContainer.innerHTML = "";


			editorData.pokeballs.forEach(ball => {

				const optionElement =
					document.createElement("button");

				optionElement.type = "button";
				optionElement.className = "pokeball-option";

				optionElement.dataset.value =
					ball.value;


				optionElement.innerHTML = `
					<img
						src="${POKEBALL_SPRITE_BASE}${ball.sprite}"
						alt=""
					>
					<span>${ball.name}</span>
				`;


				optionElement.addEventListener("click", () => {

					select.value = ball.value;

					updateEditorBaender();

					selectedImage.src =
						POKEBALL_SPRITE_BASE + ball.sprite;

					selectedName.textContent =
						ball.name;

					dropdown.classList.remove("open");

					updatePokeballActiveOption();

				});


				optionsContainer.appendChild(optionElement);

			});

			// =========================================
			// Dropdown öffnen / schließen
			// =========================================

			selected.addEventListener("click", event => {

				event.stopPropagation();

				dropdown.classList.toggle("open");

			});


			document.addEventListener("click", event => {

				if (!dropdown.contains(event.target)) {

					dropdown.classList.remove("open");

				}

			});


			// =========================================
			// Falls Wert per JS geändert wird
			// =========================================

			// Standardwert
			if (!select.value) {

				select.value =
					editorData.pokeballs[0]?.value || "";

			}

		}
		
		function updatePokeballDropdown() {

			const select =
				document.getElementById("pokeball");

			const selectedImage =
				document.getElementById("pokeballSelectedImage");

			const selectedName =
				document.getElementById("pokeballSelectedName");

			const optionsContainer =
				document.getElementById("pokeballOptions");

			if (
				!select ||
				!selectedImage ||
				!selectedName
			) {
				return;
			}

			const value = select.value;

			const pokeballsByValue = new Map(
				editorData.pokeballs.map(
					ball => [ball.value, ball]
				)
			);

			const ball = pokeballsByValue.get(value);

			if (!ball) return;

			selectedImage.src =
				POKEBALL_SPRITE_BASE + ball.sprite;

			selectedName.textContent =
				ball.name;

			optionsContainer
				?.querySelectorAll(".pokeball-option")
				.forEach(option => {

					option.classList.toggle(
						"active",
						option.dataset.value === value
					);

				});

		}
		
	</script>
	
	<script>
	
	/* =========================
	   Fähigkeiten Auswahl
	========================= */
	
	function updateAbilityDropdown() {

		const abilitySelect =
			document.getElementById("ability");

		const selectedName =
			document.getElementById("abilitySelectedName");

		const optionsContainer =
			document.getElementById("abilityOptions");


		if (!abilitySelect || !selectedName) {
			return;
		}


		const value =
			abilitySelect.value;


		selectedName.textContent =
			value || "Fähigkeit auswählen";


		if (optionsContainer) {

			optionsContainer
				.querySelectorAll(".ability-option")
				.forEach(option => {

					option.classList.toggle(
						"active",
						option.dataset.value === value
					);

				});

		}

	}
	
	</script>
